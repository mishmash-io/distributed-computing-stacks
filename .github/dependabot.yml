version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/tests/quorum/base"
      - "/tests/quorum/cluster"
      - "/tests/memory/base"
      - "/tests/storage/block/balancer"
      - "/tests/storage/block/base"
      - "/tests/storage/block/blockmanagement"
      - "/tests/storage/block/datanode"
      - "/tests/storage/block/dfs-base"
      - "/tests/storage/block/fs-base"
      - "/tests/storage/block/misc"
      - "/tests/storage/block/namenode"
      - "/misc/posix-libc/examples"
      - "/image-build"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/image-build"
    schedule:
      interval: "daily"
