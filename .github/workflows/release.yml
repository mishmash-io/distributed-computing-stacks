name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@35262ce2a3355d3a1b96677a172804d00ea74135
    secrets: inherit
    with:
      java-version: 25
      jextract-enable: true
      skip-tests: true
