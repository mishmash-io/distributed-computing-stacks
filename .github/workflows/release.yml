name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@ef6f5c0eaaa89b8373bc2e41d650fe44dbc84f4b
    secrets: inherit
    with:
      java-version: 25
      skip-tests: true
