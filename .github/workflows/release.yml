name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@2b44b0f551928bdfe293a3cc23658d204e3c2324
    secrets: inherit
    with:
      java-version: 25
      skip-tests: true
