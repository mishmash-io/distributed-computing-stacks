name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@8c80f753e97f5113169349722bc07d2c9e3c90df
    secrets: inherit
    with:
      java-version: 25
      jextract-enable: true
      skip-tests: true
