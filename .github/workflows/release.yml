name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@9c5fb3570317242037bce2c7ea34e31ce995c2a0
    secrets: inherit
    with:
      java-version: 25
      jextract-enable: true
      skip-tests: true
