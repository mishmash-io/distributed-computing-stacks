name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@5d9f21d794701caa394166e480c1ee5b670505c6
    secrets: inherit
    with:
      java-version: 25
      jextract-enable: true
      skip-tests: true
