name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@606c1c77cb4f02e77f44fe5b012b91e8625ad732
    secrets: inherit
    with:
      java-version: 25
      skip-tests: true
