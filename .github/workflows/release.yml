name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@b379367600b9446986f86d250d925ca6ce2dfc36
    secrets: inherit
    with:
      java-version: 25
      skip-tests: true
