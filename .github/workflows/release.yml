name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@ceb31703db9a05f488eb7c56716e28f6b56b1e9a
    secrets: inherit
    with:
      java-version: 25
      skip-tests: true
