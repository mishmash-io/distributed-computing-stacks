# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      run_tests:
        description: Set to 'true' to also run the test jobs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compile:
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@ef6f5c0eaaa89b8373bc2e41d650fe44dbc84f4b
    permissions:
      id-token: write
      contents: write
      attestations: write
      artifact-metadata: write
    secrets: inherit
    with:
      skip-tests: true
      java-version: '25'
      cache-maven: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_tests) }}

  test:
    needs: compile
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        testset:
          - 'memory/base'
          - 'quorum/base'
          - 'quorum/cluster'
          - 'storage/block/base'
          - 'storage/block/balancer'
          - 'storage/block/blockmanagement'
          - 'storage/block/datanode'
          - 'storage/block/namenode'
          - 'storage/block/dfs-base'
          - 'storage/block/fs-base'
          - 'storage/block/misc'
        include:
          - telemetrygrpcport: 4317
            testset: 'quorum/base'
          - telemetryhttpport: 4318
            testset: 'quorum/base'
          - telemetrygrpcport: 4319
            testset: 'storage/block/base'
          - telemetryhttpport: 4320
            testset: 'storage/block/base'
          - telemetrygrpcport: 4321
            testset: 'storage/block/balancer'
          - telemetryhttpport: 4322
            testset: 'storage/block/balancer'
          - telemetrygrpcport: 4323
            testset: 'storage/block/blockmanagement'
          - telemetryhttpport: 4324
            testset: 'storage/block/blockmanagement'
          - telemetrygrpcport: 4325
            testset: 'storage/block/datanode'
          - telemetryhttpport: 4326
            testset: 'storage/block/datanode'
          - telemetrygrpcport: 4327
            testset: 'storage/block/dfs-base'
          - telemetryhttpport: 4328
            testset: 'storage/block/dfs-base'
          - telemetrygrpcport: 4329
            testset: 'storage/block/fs-base'
          - telemetryhttpport: 4330
            testset: 'storage/block/fs-base'
          - telemetrygrpcport: 4331
            testset: 'storage/block/misc'
          - telemetryhttpport: 4332
            testset: 'storage/block/misc'
          - telemetrygrpcport: 4333
            testset: 'storage/block/namenode'
          - telemetryhttpport: 4334
            testset: 'storage/block/namenode'
          - telemetrygrpcport: 4335
            testset: 'quorum/cluster'
          - telemetryhttpport: 4336
            testset: 'quorum/cluster'
          - telemetrygrpcport: 4337
            testset: 'memory/base'
          - telemetryhttpport: 4338
            testset: 'memory/base'
          - telemetryoutput: 'memory-base'
            testset: 'memory/base'
          - telemetryoutput: 'quorum-base'
            testset: 'quorum/base'
          - telemetryoutput: 'quorum-cluster'
            testset: 'quorum/cluster'
          - telemetryoutput: 'storage-block-base'
            testset: 'storage/block/base'
          - telemetryoutput: 'storage-block-balancer'
            testset: 'storage/block/balancer'
          - telemetryoutput: 'storage-block-blockmanagement'
            testset: 'storage/block/blockmanagement'
          - telemetryoutput: 'storage-block-datanode'
            testset: 'storage/block/datanode'
          - telemetryoutput: 'storage-block-dfs-base'
            testset: 'storage/block/dfs-base'
          - telemetryoutput: 'storage-block-fs-base'
            testset: 'storage/block/fs-base'
          - telemetryoutput: 'storage-block-misc'
            testset: 'storage/block/misc'
          - telemetryoutput: 'storage-block-namenode'
            testset: 'storage/block/namenode'
          - testname: 'Base memory tests'
            testset: 'memory/base'
          - testname: 'Base distributed quorum tests'
            testset: 'quorum/base'
          - testname: 'Quorum cluster tests'
            testset: 'quorum/cluster'
          - testname: 'Base distributed block storage tests'
            testset: 'storage/block/base'
          - testname: 'Distributed block storage balancer tests'
            testset: 'storage/block/balancer'
          - testname: 'Distributed block storage management tests'
            testset: 'storage/block/blockmanagement'
          - testname: 'Distributed block storage datanode tests'
            testset: 'storage/block/datanode'
          - testname: 'Base distributed block dfs storage tests'
            testset: 'storage/block/dfs-base'
          - testname: 'Base distributed block fs storage tests'
            testset: 'storage/block/fs-base'
          - testname: 'Misc distributed block storage tests'
            testset: 'storage/block/misc'
          - testname: 'Distributed block storage namenode tests'
            testset: 'storage/block/namenode'
    name: Testing, ${{ join(matrix.*, ' - ') }}

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Set up JDK 25
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup tests telemetry collection
      id: setup-telemetry
      uses: mishmash-io/setup-telemetry-collection@a3bbcb4da8eae761344531d41a302bc8963dbc65 # v1.0.7
      with:
        java-agent-version: '2.27.0'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        logs-artifact: telemetry-logs-${{ matrix.telemetryoutput }}
        metrics-artifact: telemetry-metrics-${{ matrix.telemetryoutput }}
        traces-artifact: telemetry-traces-${{ matrix.telemetryoutput }}
        save-profiles: true
        emit-own-telemetry: true
        profiles-artifact: telemetry-profiles-${{ matrix.telemetryoutput }}
        grpc-port: ${{ matrix.telemetrygrpcport }}
        http-port: ${{ matrix.telemetryhttpport }}

    - name: Restore cached build artifacts
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: buildcache
      with:
        path: ~/.m2/repository
        key: ${{ needs.compile.outputs.build-cache-key }}
        fail-on-cache-miss: true
    - name: Download additional deps to keep surefire plugin happy when offline
      # needed by quorum/cluster, which uses testng (TODO: download automatically when 'going offline' for tests)
      run: mvn dependency:get -Dartifact=org.apache.maven.surefire:surefire-testng:3.5.6
    - name: Run test set ${{ matrix.testset }}
      env:
        OTEL_SERVICE_NAME: maven-test-service
        #OTEL_RESOURCE_ATTRIBUTES: git.ref=${{ github.ref }},git.sha=${{ github.sha }}
        #OTEL_EXPORTER_OTLP_PROTOCOL: grpc
        #OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:${{ matrix.telemetryport }}
      run: cd tests/${{ matrix.testset }} && mvn --offline -Dsurefire.rerunFailingTestsCount=2 -Dtest.instrumentation.opts=-javaagent:${{ steps.setup-telemetry.outputs.java-agent }} test --file pom.xml
    - name: Create test reports
      run: cd tests/${{ matrix.testset }} && mvn javadoc:test-javadoc jxr:test-jxr-no-fork surefire-report:report-only
      if: always()
    - name: Upload tests report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      continue-on-error: true
      with:
        name: test-reports-${{ matrix.telemetryoutput }}
        path: tests/${{ matrix.testset }}/target/reports
    - name: Upload tests extra files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      continue-on-error: true
      with:
        name: test-raw-files-${{ matrix.telemetryoutput }}
        path: tests/${{ matrix.testset }}/target/surefire
    - name: Upload tests raw reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      continue-on-error: true
      with:
        name: test-raw-reports-${{ matrix.telemetryoutput }}
        path: tests/${{ matrix.testset }}/target/surefire-reports

  site:
    name: Update project web site
    needs: test
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_tests)) && (needs.test.result == 'success' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download test reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: test-reports
          pattern: test-reports-*
          merge-multiple: false
      - name: Copy static files
        run: cp -R site/* test-reports
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: test-reports/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
